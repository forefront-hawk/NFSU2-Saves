# [NFSU2_ROAM_RATE, NFSU2_ROAM_DELAY, NFSU2_ROAM_EXTRAP]
#roam_rate = 20
#roam_delay = 100
#roam_extrap = 250
# The free-roam car memory pool in KB, raised for other players' cars (the
# game's own is 11000; a value at or below it is ignored, as it would leave
