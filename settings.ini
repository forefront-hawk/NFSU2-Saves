#roam_delay = 100
#roam_extrap = 250

# ---- Added by a newer version of the app (options this file did not list yet) ----

# Free roam tuning: the dyno setup your car drives in free roam, circuit,
# drag, drift, streetx or url.  A car with no setup of that kind drives its
# circuit one.  Races always use their own kind's setup.  circuit = as in
# the original game.  [NFSU2_ROAM_TUNING]
#roam_tuning = circuit

# The Construction Tunnel open in career free roam: the tunnel and ramps of
# the drag race Tunnel Construction as a road (tools/open_tunnel.py makes
# them from the game's files).  Its ends open as the career opens the roads
# behind them; races keep the original map.  off = the original game.
# [NFSU2_OPEN_TUNNEL]
#open_tunnel = off

# The airport's parking garage open in career free roam: both its floors,
# where a career starts, to drive and park in, its two doors open, a ramp
# up to the top deck in each half and its parked cars gone
# (tools/open_parkade.py makes it from the game's files).  Races keep the
# original map.  off = the original game.
# [NFSU2_OPEN_PARKADE]
#open_parkade = off

# The skateboard in free roam (Mods: Skateboard): on = its key (L at
# first) or its icon in the page's menu puts you on it beside your car;
# off = neither, and its key is the game's.  Whether you see other players'
# skaters: show_offcar.  [NFSU2_SKATEBOARD]
#skateboard = off

# Crash damage, as FRS Mods' Crashing Foreign Cars has it: the racers' cars
# (yours and the AI's) dent where they are hit, scratch, lose their bumpers,
# mirrors, hood, trunk lid and doors, and break their lights.  Only what is
# seen: the engine, the suspension and the handling are as before, and the
# game's own repair (a race's start, the garage) takes the damage away.
# In free roam other players who have it on see the damage of your car;
# off, you see every car undamaged.  off (the default) = the original game.
# [NFSU2_DAMAGE]
#crash_damage = off

# Each car's stance, as Archie's Stance Mod has it, set in the garage's
# Body Shop (Stance, after Rims): the camber front and rear, how far the
# wheels stand out, how wide the tires are, how low or high the body sits
# over them and whether the spoiler shows.
# Only what is seen: the car drives as before.  Other players see your
# car's stance in free roam.
# off = the original game (the values stay for when it is on again).
# [NFSU2_STANCE]
#stance = off

# Other players' cars: shown = with the looks they chose with the mods
# (their stance), as they see them; original = as the original game draws
# them.  Your own car keeps its own either way.  [NFSU2_OTHERS_MOD_PARTS]
#others_mod_parts = shown

# Other players' skateboards and drones in free roam: on = you see them
# beside their cars; off = only their cars, and nothing of them is loaded.
# Yours is seen by players who have it on either way.  [NFSU2_SHOW_OFFCAR]
#show_offcar = off

# The career's rubberbanding (Mods: Rubberbanding).  In a career race the
# game slows opponents who are ahead of you and gives ones behind you more
# power, grip and top speed (up to 37% more when they are 320 m behind).
# noboost = they still wait for you, but none behind ever beats its own
# pace; off = neither, as Quick Race with Catch Up off.  original = the
# original game.  Only your own career races: Quick Race keeps its own Catch
# Up option, and LAN and online races have no computer opponents.
# [NFSU2_CATCHUP]
#catchup = original

# NFS Carbon's transmission whine on your car, as ropi's Underground 2
# Transmission Whine (github.com/ropi336/UG2WhineGen) has it: a whine rising
# with the speed, quiet for a moment at each upshift, and its own in
# reverse, by the game's Engine Volume.  Its sounds download once it is on.
# off = the original game.
# [NFSU2_GEARBOX_WHINE]
#gearbox_whine = off

# Seven cars keep their engine sound when upgraded.  In the game the last
# engine part turns the RX-7, RX-8, Supra and IS300 into a Ferrari 360 and
# the TT and Tiburon into a Honda S2000, and the Cat-Back Exhaust turns the
# Skyline into the Ferrari.  On, they keep what they had (the Skyline its
# stock sound).  Only what you hear, the power stays.  off = the original game.
# [NFSU2_ENGINE_KEEP_SOUND]
#engine_keep_sound = off

# The cars' vinyls and doorlines at 1024x1024, as AdrienShadow's High
# Quality Vinyls & Doorlines has them: the game's designs and colours,
# sharper up close.  On a computer only, where it starts on; each car's
# pictures download as it is seen, about 100 KB.  off = the original game.
# [NFSU2_HQ_VINYLS]
#hq_vinyls = on

# The menus', the HUD's and the maps' textures: original = the game's; map =
# JeansBig's Detailed Map (nfsmods.xyz/mod/4485): the minimap's and the
# world map's maps redrawn at 2048x2048 with the missing shortcuts, the
# menus and the HUD the game's; uhud = the Detailed Map and LunicAura106's
# Upscaled HUD (nfsmods.xyz/mod/4319): the menus, the race HUD, the fonts
# and the car and brand logos redrawn at four times their size; where this
# server has the mods' texture packs (a language pack's own fonts stay; most
# phones' GPUs decode the larger textures into four times the memory;
# NFSU2_MAP_TEXTURES = original keeps the game's maps).  [NFSU2_UI_TEXTURES]
#ui_textures = original
# Sharper roads and pavements up close: the game's own textures at four times
# their size, where this server has the pack (about 35 MB to fetch).  Phones
# and tablets: off.  [NFSU2_ROAD_TEXTURES]
#road_textures = on
# Textures without smoothing (point sampling), blocky like early PC games;
# on overrides the game's Texture Filtering.  [NFSU2_PIXELATED_TEXTURES]
#pixelated_textures = off
# The game's own Full Scene Anti-Aliasing (Options > Display > Customize
# Display Settings), drawn at 4 samples: smoother edges for more of the
# graphics' work; a new player on a computer starts with it on.  off = not
# offered (the option stays greyed out).  Phones, computers with AMD Vega
# (GCN-5) or Qualcomm graphics, and any computer whose graphics stopped just
# after Play with it on: off.  [NFSU2_FSAA]
#fsaa = on
# Sharper textures in the distance (roads, their lines, building fronts):
# anisotropic filtering where the game asks for it, which the original
# game never got.  Phones and tablets: off.  [NFSU2_ANISOTROPIC]
#anisotropic = on

# Graphics without BC texture compression (most phones and tablets): the
# textures with soft transparency (menus, the HUD, leaves, fences, glass,
# smoke) go up compressed as ASTC, in a quarter of the memory unpacking
# them takes, for a little more work on loading screens.  Their
# transparency then has 4 steps in each 4x4 block of texels where the
# game's own has 8 or 16, so soft edges can look slightly coarser.
# off = unpack them as before: exact, with four times the memory.
# Graphics with BC (computers) are not affected.  [NFSU2_ASTC_ALPHA]
#astc_alpha = on

# The keys of this site's own controls, beside the game's (the start page's
# Controls, Site, sets them by a press): the browser's name of a key (KeyX,
# Digit5, F6, Numpad7, Backquote ...) or off.  Drift mode and the hood,
# trunk and doors (free roam), the horn (with other players), the
# headlights (a tap off or on, held high beam), Message a friend and Add
# friend (free roam), the race lobby card's next lobby, Friends & crew
# only and invite (free roam), photo mode, hiding the HUD while driving
# (off again at each Play), the drone and the skateboard (free roam), the
# page's menu (never off), the next song and the frame-rate counter.  A key
# one of the game's controls is on (its Options, Controls) stays the game's.
# [NFSU2_KEY_DRIFT, NFSU2_KEY_SHOWOFF, NFSU2_KEY_HORN, NFSU2_KEY_LIGHTS,
# NFSU2_KEY_MESSAGE, NFSU2_KEY_FRIEND, NFSU2_KEY_LOBBY, NFSU2_KEY_LOBBY_NEW,
# NFSU2_KEY_LOBBY_PRIVATE, NFSU2_KEY_LOBBY_INVITE, NFSU2_KEY_PHOTO,
# NFSU2_KEY_HUD, NFSU2_KEY_DRONE, NFSU2_KEY_SKATE, NFSU2_KEY_MENU,
# NFSU2_KEY_SONG, NFSU2_KEY_FPS]
#key_drift = KeyX
#key_showoff = KeyO
#key_horn = KeyN
#key_lights = KeyG
#key_message = KeyI
#key_friend = KeyF
#key_lobby = KeyE
#key_lobby_new = KeyB
#key_lobby_private = KeyV
#key_lobby_invite = KeyZ
#key_photo = F12
#key_hud = F10
#key_drone = F6
#key_skate = KeyL
#key_menu = F9
#key_song = F7
#key_fps = F8
# The controller's: the D-pad direction held a second for drift mode
# (driving) and the hood, trunk and doors (parked): ddown, dup, dleft,
# dright or off, a short press staying the game's; the stick click for the
# horn and the one for quick chat: ls, rs or off; the free look round the
# car while driving: auto (the right stick, the left one while the game's
# controls read the right one) or off (no stick looks round, and stick up
# no longer switches the headlights).  The game's Home button, or both
# sticks pressed in, always opens the page's menu.
# [NFSU2_BUTTON_HOLD, NFSU2_BUTTON_HORN, NFSU2_BUTTON_CHAT, NFSU2_BUTTON_LOOK]
#button_hold = ddown
#button_horn = ls
#button_chat = rs
#button_look = auto
# The FPV drone's rates, for pilots: as Betaflight's Actual rates has them,
# center sensitivity and max rate (degrees a second), and expo.
# [NFSU2_DRONE_RATES]
#drone_rates = 150, 670, 0.5
# A tuning knob, not a setting: the skateboard's ride with other values,
# its numbers by name, each with its value (top pushing speed m/s, the
# wheels' grip, the highest ollie m).  For trying them out; left out, the
# ride is as it comes.  [NFSU2_SKATE_TUNE]
#skate_tune = push_top 5.5, grip 0.8, rise_max 0.8

# Your license plate, on your car: up to 8 letters A to Z and digits (other
# players see it in free roam).  Empty = the game's own plate.
# [NFSU2_LICENSE_PLATE]
#license_plate =
